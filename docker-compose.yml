services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: giga_article
    ports:
      - "5432:5432"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d
    restart: no
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d giga_article"]
      interval: 2s
      timeout: 2s
      retries: 10

  php:
    build:
      context: .
    ports:
      - "1234:80"
    volumes:
      - ./:/var/www/html:cached
    depends_on:
      db:
        condition: service_healthy
    restart: no
